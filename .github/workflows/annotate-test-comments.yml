# One-time documentation workflow for docs/source-comments.
name: Annotate test comments

on:
  push:
    branches:
      - docs/source-comments
    paths:
      - .github/workflows/annotate-test-comments.yml
      - scripts/annotate_test_comments.py

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/source-comments
          fetch-depth: 0

      - name: Verify annotation script
        run: python3 scripts/annotate_test_comments.py --self-test

      - name: Annotate test sources
        run: python3 scripts/annotate_test_comments.py

      - name: Verify comments-only diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Assets/Phyzzle/Tests; then
            echo "No test files needed annotation."
            exit 0
          fi

          if git diff --numstat -- Assets/Phyzzle/Tests | awk '$2 != 0 { exit 1 }'; then
            :
          else
            echo "Detected deleted lines in test diff."
            git diff --stat -- Assets/Phyzzle/Tests
            exit 1
          fi

          bad_added_lines="$(git diff --unified=0 -- Assets/Phyzzle/Tests | grep '^+' | grep -v '^+++' | grep -Ev '^\+[[:space:]]*///' || true)"
          if [ -n "$bad_added_lines" ]; then
            echo "Detected non-comment added lines:"
            printf '%s\n' "$bad_added_lines"
            exit 1
          fi

          git diff --check -- Assets/Phyzzle/Tests

      - name: Commit annotations
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Assets/Phyzzle/Tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Phyzzle/Tests
          git commit -m "docs: annotate test classes and methods"
          git push origin HEAD:docs/source-comments
